# ---------------------------------------------------------------------------
# DSH provider snippet — for ADVANCED users only.
#
# MOST USERS CAN IGNORE THIS FILE. Since v1.1 the bundle's cordis.patch.yml
# auto-registers the `deveco` provider, so on a fresh/default DSH profile the
# GLM models appear automatically after installing the bundle — no manual
# edit and no environment variable needed.
#
# WHO still needs this: if YOUR profile already has an `llm-pi-ai` row with
# `config.providers` (e.g. you configured fox-aws or other providers), DSH
# replaces that config wholesale and YOUR row wins over the bundle's. In that
# case add the `deveco:` block below into YOUR OWN `config.providers` once,
# next to your existing providers (mind the indentation). Do NOT paste it
# anywhere else and do NOT overwrite your whole profile.
#
# This entry uses an inline `headers.authorization` instead of apiKeyEnv, so
# it needs NO environment variable: pi-ai treats a non-empty Authorization
# header as the API key, and the local proxy ignores the bearer value.
# Contains no personal data and no account credentials.
# ---------------------------------------------------------------------------
deveco:
  displayName: DevEco Code
  api: openai-completions
  baseURL: http://127.0.0.1:17128/v2
  headers:
    authorization: Bearer deveco-local
  models:
    - id: GLM-5.3-DevEco
      name: GLM-5.3 (DevEco)
    - id: GLM-5.1-DevEco
      name: GLM-5.1 (DevEco)
